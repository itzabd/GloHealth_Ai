{% extends "base.html" %}

{% block title %}{{ plan_name }} Details{% endblock %}

{% block content %}
<div class="dashboard-wrapper">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-hover p-4 text-center">
                <h2>{{ plan_name }}</h2>
                <h4 class="text-primary">{{ plan.price }}</h4>
                <h5 class="mt-3">Features:</h5>
                <ul class="text-start">
                    {% for feature in plan.features %}
                        <li>{{ feature }}</li>
                    {% endfor %}
                </ul>
                <a href="{{ url_for('subscribe_plan', plan_name=plan_name) }}" class="btn btn-accent mt-3">Subscribe</a>
                <a href="{{ url_for('plans') }}" class="btn btn-outline-secondary mt-2">Back to Plans</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
