{% extends "base.html" %}

{% block title %}Plans{% endblock %}

{% block extra_css %}
<style>
body {
    background: linear-gradient(135deg, #00b4db, #0083b0, #3a7bd5) !important;
    color: #1a202c;
}
.card-hover {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px) saturate(150%);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
}
.card-hover:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.25);
}
.btn-accent {
    background: linear-gradient(90deg, #FF9149, #FF6B6B);
    border: none;
    color: white;
    font-weight: 500;
    border-radius: 10px;
    padding: 0.45rem 1.2rem;
    transition: 0.3s;
}
.btn-accent:hover {
    opacity: 0.9;
    transform: scale(1.03);
}
</style>
{% endblock %}

{% block content %}
<div class="dashboard-wrapper">
    <div class="row mb-4 justify-content-center">
        <div class="col-md-8">
            <h2 class="section-header text-center mb-4">Available Plans</h2>
            <div class="row g-4">
                {% for plan in plans %}
                <div class="col-md-4">
                    <div class="card card-hover h-100 text-center p-3">
                        <h5>{{ plan.name }}</h5>
                        <p>{{ plan.details }}</p>
                        <h6>{{ plan.price }}</h6>
                        <button class="btn btn-accent mt-2">Subscribe</button>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
