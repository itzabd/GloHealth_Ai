{% extends "base.html" %}

{% block title %}Edit Doctor · GloHealth AI{% endblock %}

{% block content %}
<div class="gh-container gh-container--narrow" style="padding-top: 40px; padding-bottom: 60px;">
  <div class="gh-card" style="box-shadow: var(--gh-shadow-md); border-radius: var(--gh-radius-xl); padding: 32px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--gh-border);">
      <div>
        <h2 style="margin: 0; font-size: 22px; font-weight: 700; color: var(--gh-primary);" data-i18n="c.edit">Edit Specialist Profile</h2>
        <p style="margin: 4px 0 0; font-size: 13px; color: var(--gh-text-muted);">Update details, schedule, and fee for {{ doctor.name }}.</p>
      </div>
      <a href="{{ url_for('admin_doctors') }}" class="gh-btn gh-btn--outline gh-btn--sm" data-i18n="c.cancel">Cancel</a>
    </div>

    <form method="POST" style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label class="gh-form-label" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gh-text-muted); margin-bottom: 6px;">Doctor Full Name *</label>
        <input type="text" name="name" class="gh-input" value="{{ doctor.name }}" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div>
          <label class="gh-form-label" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gh-text-muted); margin-bottom: 6px;">Specialty *</label>
          <input type="text" name="specialty" class="gh-input" value="{{ doctor.specialty }}" required>
        </div>
        <div>
          <label class="gh-form-label" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gh-text-muted); margin-bottom: 6px;">Consultation Fee (BDT) *</label>
          <input type="number" step="0.01" name="consultation_fee" class="gh-input" value="{{ doctor.consultation_fee }}" required>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div>
          <label class="gh-form-label" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gh-text-muted); margin-bottom: 6px;">Division</label>
          <input type="text" name="division" class="gh-input" value="{{ doctor.division or '' }}">
        </div>
        <div>
          <label class="gh-form-label" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gh-text-muted); margin-bottom: 6px;">District</label>
          <input type="text" name="district" class="gh-input" value="{{ doctor.district or '' }}">
        </div>
      </div>

      <div>
        <label class="gh-form-label" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gh-text-muted); margin-bottom: 6px;">Hospital / Clinic Affiliation</label>
        <input type="text" name="hospital" class="gh-input" value="{{ doctor.hospital or '' }}">
      </div>

      <div>
        <label class="gh-form-label" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gh-text-muted); margin-bottom: 6px;">Contact Phone / Telemedicine Desk</label>
        <input type="text" name="contact" class="gh-input" value="{{ doctor.contact or '' }}">
      </div>

      <div style="display: flex; gap: 12px; margin-top: 12px;">
        <button type="submit" class="gh-btn gh-btn--primary" style="flex: 1;" data-i18n="c.save_changes">Save Changes</button>
        <a href="{{ url_for('admin_doctors') }}" class="gh-btn gh-btn--outline" data-i18n="c.cancel">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
