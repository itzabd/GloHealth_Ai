{% extends "base.html" %}

{% block title %}Schedule New Appointment · Admin Console · GloHealth AI{% endblock %}

{% block content %}
<div class="gh-container gh-container--narrow" style="padding-top: 40px; padding-bottom: 60px;">
  <div class="gh-card" style="box-shadow: var(--gh-shadow-md); border-radius: var(--gh-radius-xl); padding: 32px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--gh-border);">
      <div>
        <h2 style="margin: 0; font-size: 22px; font-weight: 700; color: var(--gh-primary);" data-i18n="c.add">Book New Consultation</h2>
        <p style="margin: 4px 0 0; font-size: 13px; color: var(--gh-text-muted);">Schedule and pair a registered patient with a verified clinical specialist.</p>
      </div>
      <a href="{{ url_for('admin_appointments') }}" class="gh-btn gh-btn--outline gh-btn--sm" data-i18n="c.cancel">Cancel</a>
    </div>

    <form method="POST" style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label class="gh-form-label" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gh-text-muted); margin-bottom: 6px;">Select Patient *</label>
        <select name="user_id" class="gh-input" required>
          <option value="" data-i18n="c.select_user">Choose patient record...</option>
          {% for u in users %}
            <option value="{{ u.id }}">{{ u.full_name or 'Patient' }} ({{ u.email }})</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="gh-form-label" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gh-text-muted); margin-bottom: 6px;">Assigned Clinician *</label>
        <select name="doctor_id" class="gh-input" required>
          <option value="" data-i18n="c.select_doctor">Choose specialist...</option>
          {% for d in doctors %}
            <option value="{{ d.id }}">{{ d.name }} — {{ d.specialty }} (Fee: ৳{{ d.consultation_fee }})</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="gh-form-label" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gh-text-muted); margin-bottom: 6px;">Scheduled Date & Time *</label>
        <input type="datetime-local" name="scheduled_time" class="gh-input" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div>
          <label class="gh-form-label" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gh-text-muted); margin-bottom: 6px;">Consultation Status</label>
          <select name="status" class="gh-input">
            <option value="pending" data-i18n="ap.pend">⏱ Pending Review</option>
            <option value="confirmed" selected data-i18n="ap.conf">✓ Confirmed</option>
            <option value="completed" data-i18n="ap.comp">Completed</option>
            <option value="cancelled" data-i18n="ap.status_cancelled">Cancelled</option>
          </select>
        </div>
        <div>
          <label class="gh-form-label" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gh-text-muted); margin-bottom: 6px;">Payment Status</label>
          <select name="payment_status" class="gh-input">
            <option value="unpaid" data-i18n="ap.unpaid">Unpaid</option>
            <option value="paid" selected data-i18n="ap.paid">✓ Paid</option>
          </select>
        </div>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 12px;">
        <button type="submit" class="gh-btn gh-btn--primary" style="flex: 1;" data-i18n="c.add">Schedule Appointment</button>
        <a href="{{ url_for('admin_appointments') }}" class="gh-btn gh-btn--outline" data-i18n="c.cancel">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
